<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Lion City Rails: a Ticket to Ride-style train game on a map of Singapore. Play online with friends.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e2c46'/%3E%3Cpath d='M6 9h20M6 14h20M6 19h20M6 24h20' stroke-width='3' stroke='%23e0342a'/%3E%3Cpath d='M6 14h20' stroke='%231b9a52' stroke-width='3'/%3E%3Cpath d='M6 19h20' stroke='%23f0a30a' stroke-width='3'/%3E%3Cpath d='M6 24h20' stroke='%232468d8' stroke-width='3'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lion City Rails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: wide transit-map board on the left, play desk (players, market, hand, tickets) on the right. Stacks on phones. */
:root {
  --font-display: 'Archivo', 'Arial Narrow', 'Helvetica Neue', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  --bg: #e6ecef; --panel: #ffffff; --panel2: #f1f5f7; --ink: #13202a; --muted: #566874; --line: #ccd7de;
  --sea: #9fd3e6; --sh3: #b0dded; --sh2: #c7e9f2; --sh1: #e0f4f6; --wavec: #ffffff; --ripple: #ffffff; --wake: #ffffff;
  --land: #f0e7c4; --beach: #f9f3d6; --land-edge: #5d7068; --malay: #e3dcb8; --isle: #efe6c2; --grain: #c9bd8e;
  --forest: #bfd993; --forest-edge: #8db66a; --res: #9fd3e6; --res-edge: #4f8aa6; --tcr: #4f9d50; --tcr2: #3c8643; --thl: #7cc171; --ttk: #7a5230; --tsh: rgba(34,58,28,.2); --pfr: #3f9a54;
  --patch: #a4d78a; --patch-edge: #5f9a4e; --gshadow: rgba(30,50,30,.22);
  --lbl-sea: #3b7a9c; --lbl-land: #7b8460;
  --halo: #f6f8f3; --accent: #d71920; --primary: #0e2c46; --primary-ink: #ffffff; --glow: #ffb300; --ok: #1d8a4e; --warn: #b4531a;
  --focus: #1a66d9; --grey-line: #6c808d; --car-edge: #13202a; --shadow: 0 1px 2px rgba(10,30,45,.08), 0 6px 20px rgba(10,30,45,.07);

  --c-red: #e0342a; --c-green: #1b9a52; --c-purple: #9b3fc0; --c-amber: #f0a30a; --c-blue: #2468d8; --c-brown: #99602f; --c-teal: #109ea3; --c-slate: #d4177f; /* LRT: key stays 'slate' in the data */
  --ct-red: #fff; --ct-green: #fff; --ct-purple: #fff; --ct-amber: #1d1400; --ct-blue: #fff; --ct-brown: #fff; --ct-teal: #fff; --ct-slate: #fff;

  --p1: #e8479a; --p2: #17222c; --p3: #f2c400; --p4: #86c426; --p5: #ff7a1a;
  --pt1: #fff; --pt2: #fff; --pt3: #1a1400; --pt4: #10200a; --pt5: #200d00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1218; --panel: #131d25; --panel2: #1a2630; --ink: #e7eef2; --muted: #94a7b4; --line: #26343e;
    --sea: #0f2b3e; --sh3: #14354a; --sh2: #194259; --sh1: #1f506b; --wavec: #5a93b3; --ripple: #7db4d2; --wake: #8fc1dc;
    --land: #3a4d41; --beach: #50665a; --land-edge: #a6c0b2; --malay: #2b372f; --isle: #33433a; --grain: #4c5e50;
    --forest: #284a34; --forest-edge: #3a6a47; --res: #0f2b3e; --res-edge: #5b93b0; --tcr: #2f7b46; --tcr2: #26683a; --thl: #4a9a5c; --ttk: #8a6a48; --tsh: rgba(0,0,0,.32); --pfr: #3aa05c;
    --patch: #3f7a48; --patch-edge: #6fae6f; --gshadow: rgba(0,0,0,.34);
    --lbl-sea: #7fb4d2; --lbl-land: #8aa392;
    --halo: #111d25; --accent: #ff4d55; --primary: #dfe9ef; --primary-ink: #0b1a26; --glow: #ffc533; --ok: #3cc57b; --warn: #ff9a4d;
    --focus: #6aa6ff; --grey-line: #9db0bc; --car-edge: #e9f0f4; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --c-red: #ff5a4d; --c-green: #2fbf70; --c-purple: #b968e0; --c-amber: #ffb727; --c-blue: #4c8fff; --c-brown: #c58650; --c-teal: #27c3c8; --c-slate: #e32c9c;
    --p2: #eef3f6; --pt2: #0c141a; --p4: #98d83a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1218; --panel: #131d25; --panel2: #1a2630; --ink: #e7eef2; --muted: #94a7b4; --line: #26343e;
  --sea: #0f2b3e; --sh3: #14354a; --sh2: #194259; --sh1: #1f506b; --wavec: #5a93b3; --ripple: #7db4d2; --wake: #8fc1dc;
  --land: #3a4d41; --beach: #50665a; --land-edge: #a6c0b2; --malay: #2b372f; --isle: #33433a; --grain: #4c5e50;
  --forest: #284a34; --forest-edge: #3a6a47; --res: #0f2b3e; --res-edge: #5b93b0; --tcr: #2f7b46; --tcr2: #26683a; --thl: #4a9a5c; --ttk: #8a6a48; --tsh: rgba(0,0,0,.32); --pfr: #3aa05c;
  --patch: #3f7a48; --patch-edge: #6fae6f; --gshadow: rgba(0,0,0,.34);
  --lbl-sea: #7fb4d2; --lbl-land: #8aa392;
  --halo: #111d25; --accent: #ff4d55; --primary: #dfe9ef; --primary-ink: #0b1a26; --glow: #ffc533; --ok: #3cc57b; --warn: #ff9a4d;
  --focus: #6aa6ff; --grey-line: #9db0bc; --car-edge: #e9f0f4; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --c-red: #ff5a4d; --c-green: #2fbf70; --c-purple: #b968e0; --c-amber: #ffb727; --c-blue: #4c8fff; --c-brown: #c58650; --c-teal: #27c3c8; --c-slate: #e32c9c;
  --p2: #eef3f6; --pt2: #0c141a; --p4: #98d83a;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.42 var(--font-body); -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, p { margin: 0; }
h2, h3 { text-wrap: balance; }
[hidden] { display: none !important; }

.shell { max-width: 1520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 36px; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand h1 { font: 900 clamp(20px, 3.2vw, 28px)/1 var(--font-display); font-stretch: 125%; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; }
.stripe { display: flex; height: 22px; width: 8px; flex-direction: column; border-radius: 2px; overflow: hidden; flex: none; }
.stripe i { flex: 1; }
.status { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 10px; }
.chip-turn { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-weight: 700; }
.chip-turn.mine { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.chip-turn .seatdot { width: 14px; height: 14px; border-radius: 50%; background: var(--pc, var(--muted)); border: 2px solid var(--car-edge); flex: none; }
.chip-turn span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.codebadge { font: 800 14px var(--font-display); letter-spacing: .14em; padding: 5px 10px; border-radius: 8px; border: 1px dashed var(--muted); background: var(--panel); }
.topbtns { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; text-decoration: none; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.12); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.danger { color: var(--accent); }

/* game grid */
.game { display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 14px; align-items: start; }
.boardwrap { min-width: 0; }
.board { position: relative; aspect-ratio: 1280 / 800; background: var(--sea); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.zoomctl { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoomctl button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font: 700 18px var(--font-display); line-height: 1; display: grid; place-items: center; box-shadow: var(--shadow); }
.maptip { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px); padding: 6px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; box-shadow: var(--shadow); pointer-events: none; }
.legend { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: 46%; padding: 6px 9px; border-radius: 8px; background: color-mix(in srgb, var(--panel) 86%, transparent); border: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.legend svg { width: 12px; height: 12px; fill: currentColor; }

/* svg paint */
.sea { fill: var(--sea); }
.wv { fill: none; stroke: var(--wavec); stroke-width: 1.5; stroke-linecap: round; opacity: .6; }
.shore path { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.shore .sh3 { stroke: var(--sh3); stroke-width: 44px; }
.shore .sh2 { stroke: var(--sh2); stroke-width: 26px; }
.shore .sh1 { stroke: var(--sh1); stroke-width: 11px; }
.land { fill: var(--land); }
.isle { fill: var(--isle); }
.malay { fill: var(--malay); }
.beach { fill: none; stroke: var(--beach); stroke-width: 11px; stroke-linejoin: round; }
.grain { opacity: .35; fill: var(--grain); pointer-events: none; }
.forest { fill: var(--forest); stroke: var(--forest-edge); stroke-width: 1.2; stroke-linejoin: round; }
.res { fill: var(--res); stroke: var(--res-edge); stroke-width: 1.4; stroke-linejoin: round; }
.coast { stroke: var(--land-edge); stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
.tcr { fill: var(--tcr); } .tsh { fill: var(--tsh); } .thl { fill: var(--thl); } .ttk { fill: var(--ttk); }
.thlp { fill: none; stroke: var(--thl); stroke-width: 1.2; stroke-linecap: round; }
.ptk { fill: none; stroke: var(--ttk); stroke-width: 1.7; stroke-linecap: round; }
.pfr { fill: var(--pfr); }
.wake { fill: none; stroke: var(--wake); stroke-width: 1.7; stroke-linecap: round; opacity: .85; }
.patch { fill: var(--patch); stroke: var(--patch-edge); stroke-width: 1.4; stroke-linejoin: round; }
.tuft { fill: none; stroke: var(--patch-edge); stroke-width: 1.4; stroke-linecap: round; }
.gsh { fill: var(--gshadow); }
.water text { font-family: var(--font-display); }
.water text.big { fill: var(--lbl-land); font-size: 22px; font-weight: 800; font-stretch: 125%; letter-spacing: .22em; opacity: .75; }
.water text.small { fill: var(--lbl-sea); font-size: 11.5px; font-weight: 600; letter-spacing: .14em; font-style: italic; }
.rose .ring1 { fill: var(--sh1); stroke: var(--lbl-sea); stroke-width: 1.2; opacity: .9; }
.rose .ring2 { fill: none; stroke: var(--lbl-sea); stroke-width: .8; stroke-dasharray: 2 3; }
.rose .star1 { fill: var(--beach); stroke: var(--land-edge); stroke-width: 1; stroke-linejoin: round; }
.rose .star2 { fill: var(--land-edge); }
.rose .hub { fill: var(--accent); }
.rose .north { font: 800 12px var(--font-display); fill: var(--lbl-sea); }
.hit { fill: none; stroke: transparent; stroke-width: 20; stroke-linecap: round; pointer-events: stroke; cursor: pointer; transition: stroke .12s; }
.route[data-color] { --rc: var(--grey-line); }
.car { fill: color-mix(in srgb, var(--rc) 30%, var(--land)); stroke: var(--rc); stroke-width: 2.2; transition: opacity .2s; }
.route.ferry .car { stroke-dasharray: 5 3; }
.mark { fill: var(--rc); pointer-events: none; }
.mark.wildmark { fill: var(--ink); }
.route[data-color="grey"] .mark.wildmark { fill: var(--ink); }
.seat { font: 800 10px var(--font-display); fill: var(--pt, #fff); pointer-events: none; display: none; }
.route.owned .car { fill: var(--pc); stroke: var(--car-edge); stroke-width: 1.7; stroke-dasharray: none; }
.route.owned .mark { display: none; }
.route.owned .seat { display: block; }
.route.owned .hit { cursor: default; }
.route.can .hit { stroke: var(--glow); stroke-opacity: .5; }
.route.hlp .hit { stroke: var(--accent); stroke-opacity: .4; }
.route.sel .hit { stroke: var(--focus); stroke-opacity: .7; }
.route.dim .car { opacity: .45; }
.route:focus-visible { outline: none; }
.route:focus-visible .hit { stroke: var(--focus); stroke-opacity: .8; }
.route.last .car { animation: pop 1.4s ease-out 2; transform-box: fill-box; transform-origin: center; }
@keyframes pop { 0%, 100% { opacity: 1; } 40% { opacity: .35; } }
.node .ring { fill: #fff; stroke: #111c24; stroke-width: 3.4; }
:root[data-theme="dark"] .node .ring { fill: #0c141a; stroke: #f1f5f7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .node .ring { fill: #0c141a; stroke: #f1f5f7; } }
.node .core { fill: var(--accent); }
.node .flag { fill: none; stroke: var(--glow); stroke-width: 2.6; stroke-dasharray: 3.5 3.5; opacity: 0; }
.node.tk .flag { opacity: .85; }
.node.hl .flag { opacity: 1; stroke-width: 4; stroke-dasharray: none; animation: ping 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ping { 50% { transform: scale(1.18); } }
.node { pointer-events: none; }
.lbl { font: 700 13px var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 4.2px; stroke-linejoin: round; pointer-events: none; }
.lbl .sub { font-size: 10.5px; font-weight: 400; fill: var(--muted); }
.lm { pointer-events: none; color: #17252f; }
:root[data-theme="dark"] .lm { color: #eaf1f5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lm { color: #eaf1f5; } }
.lm .art { filter: drop-shadow(0 1px 0.8px rgba(8, 20, 30, .28)); }
.lm-cap { font: 700 9.5px var(--font-display); letter-spacing: .05em; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 3.4px; stroke-linejoin: round; }

/* side desk */
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (min-width: 981px) { .side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding-right: 2px; scrollbar-width: thin; } }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); }
.box h3 { font: 800 12px var(--font-display); font-stretch: 112%; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.box h3 small { font: 400 12px var(--font-body); letter-spacing: 0; text-transform: none; }

.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pl { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 8px; border: 1px solid transparent; border-radius: 10px; background: var(--panel2); }
.pl.turn { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, var(--panel)); }
.chip { width: 26px; height: 26px; border-radius: 50%; background: var(--pc); color: var(--pt); font: 800 13px var(--font-display); display: grid; place-items: center; border: 2px solid var(--car-edge); }
.pname { min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
.pname b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.pname em { font-style: normal; font-size: 11px; font-weight: 700; color: var(--primary-ink); background: var(--primary); border-radius: 999px; padding: 0 7px; }
.pname .cpu { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.pname .on { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); align-self: center; }
.pname .off { width: 8px; height: 8px; border-radius: 50%; background: var(--line); align-self: center; }
.pstats { display: flex; gap: 10px; }
.pstats div { text-align: center; min-width: 30px; }
.pstats small { display: block; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pstats b { font: 800 15px var(--font-display); font-variant-numeric: tabular-nums; }
.pl .hostbtn { grid-column: 2 / 4; justify-self: start; }

.faceup { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.card { position: relative; aspect-ratio: 3 / 4; border-radius: 9px; border: 2px solid color-mix(in srgb, var(--cc) 55%, #000); background: var(--cc); color: var(--cct, #fff); display: grid; place-items: center; align-content: center; gap: 4px; padding: 0; font: 800 13px var(--font-display); letter-spacing: .04em; }
.card .gl { width: 22px; height: 22px; fill: currentColor; }
.card.wild { --cc: #1d2b36; color: #fff; border-color: #0b1218; background: conic-gradient(from 20deg, var(--c-red), var(--c-amber), var(--c-green), var(--c-teal), var(--c-blue), var(--c-purple), var(--c-red)); }
.card.wild .inner { background: rgba(10,16,22,.78); border-radius: 6px; padding: 4px 3px 3px; display: grid; justify-items: center; gap: 2px; font-size: 9.5px; letter-spacing: .06em; }
.card.wild .gl { width: 20px; height: 20px; }
button.card:not(:disabled):hover { transform: translateY(-3px); }
button.card { transition: transform .12s; }
button.card:disabled { opacity: .55; cursor: not-allowed; }
.decks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.deckbtn { display: grid; gap: 1px; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); font-weight: 700; line-height: 1.2; }
.deckbtn small { font-weight: 400; color: var(--muted); font-size: 12px; }
.deckbtn:disabled { opacity: .5; cursor: not-allowed; }
.deckbtn:not(:disabled):hover { border-color: var(--muted); }
.hint { margin-top: 10px; font-size: 14px; color: var(--ink); min-height: 2.8em; }
.hint b { font-weight: 700; }

.hand { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 5px; }
.hc { position: relative; aspect-ratio: 3 / 4; }
.hc .card { width: 100%; height: 100%; aspect-ratio: auto; font-size: 11px; }
.hc .card .gl { width: 16px; height: 16px; }
.hc.zero { opacity: .32; }
.hc .n { position: absolute; right: -4px; top: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--ink); color: var(--panel); font: 800 12px var(--font-display); display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.hc.zero .n { background: var(--muted); }

.tlist { display: grid; gap: 6px; }
.tix { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; text-align: left; width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); }
.tix .rt { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.tix .rt i { font-style: normal; color: var(--muted); padding: 0 3px; }
.tix .pts { font: 800 18px var(--font-display); font-variant-numeric: tabular-nums; }
.tix .st { grid-column: 1 / 3; font-size: 12.5px; color: var(--muted); }
.tix.done { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--panel)); }
.tix.done .st { color: var(--ok); font-weight: 700; }
.tix.blocked .st { color: var(--warn); font-weight: 700; }
.tix.on { outline: 2px solid var(--glow); }
.tix[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 2px var(--primary); }

.log { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; color: var(--muted); max-height: 170px; overflow: auto; }
.log li:first-child { color: var(--ink); }

/* sheet under the board */
.sheet { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.sheet .sh { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; margin-bottom: 10px; }
.sheet .sh b { font: 800 17px var(--font-display); }
.sheet .sh span { color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel2); font-weight: 700; }
.opt:hover { border-color: var(--primary); }
.opt .mini { display: flex; gap: 3px; }
.mini .card { width: 28px; aspect-ratio: 3 / 4; border-radius: 5px; font-size: 9px; gap: 1px; border-width: 1.5px; }
.mini .card .gl { width: 12px; height: 12px; }
.mini .card.wild .inner { padding: 2px; font-size: 0; gap: 0; }
.mini .card.wild .gl { width: 12px; height: 12px; }
.tpick { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; margin-bottom: 10px; }
.tpick .tix { grid-template-columns: minmax(0, 1fr) auto; }
.tpick .tix .chk { grid-column: 1 / 3; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.tpick .tix[aria-pressed="true"] .chk { color: var(--primary); }
.sheet .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

/* modals */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--bg) 62%, transparent); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); overflow: auto; }
.dialog { width: min(100%, 600px); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.28); }
.dialog.wide { width: min(100%, 860px); }
.dialog h2 { font: 900 clamp(24px, 5vw, 34px)/1.05 var(--font-display); font-stretch: 125%; text-transform: uppercase; letter-spacing: .01em; }
.dialog h2.sm { font-size: 22px; font-stretch: 112%; }
.dialog .lead { margin-top: 8px; color: var(--muted); max-width: 52ch; }
.lines { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin: 14px 0 18px; }
.lines i { flex: 1; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.cols.one { grid-template-columns: minmax(0, 440px); }
.opt-card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--panel2); display: grid; gap: 10px; align-content: start; }
.opt-card h3 { font: 800 15px var(--font-display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .08em; }
.opt-card p { color: var(--muted); font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 7px 14px; min-height: 36px; font-weight: 700; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }
.field { display: grid; gap: 4px; }
.field label { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.field input { min-height: 40px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); width: 100%; }
.field input.code { font: 800 22px var(--font-display); letter-spacing: .3em; text-transform: uppercase; text-align: center; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.note { font-size: 13px; color: var(--muted); }
.note.warn { color: var(--warn); font-weight: 700; }
.err { color: var(--accent); font-weight: 700; font-size: 14px; }
.bigcode { font: 900 clamp(40px, 12vw, 64px)/1 var(--font-display); font-stretch: 125%; letter-spacing: .18em; text-align: center; padding: 10px 0 6px; user-select: all; }
.joined { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.joined li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--panel2); }
.rules { display: grid; gap: 12px; margin-top: 14px; font-size: 15px; }
.rules h3 { font: 800 13px var(--font-display); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
.rules ul { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 3px; }
.keyrow { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; }
.keyrow span { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; }
.keyrow .sw { width: 22px; height: 16px; border-radius: 4px; background: var(--cc); color: var(--cct, #fff); display: grid; place-items: center; }
.keyrow .sw .gl { width: 10px; height: 10px; fill: currentColor; }
.table-wrap { overflow-x: auto; margin-top: 14px; }
table.res { border-collapse: collapse; width: 100%; min-width: 520px; font-variant-numeric: tabular-nums; }
table.res th { font: 700 11px var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 6px 10px; }
table.res th:first-child, table.res td:first-child { text-align: left; }
table.res td { padding: 9px 10px; text-align: right; border-top: 1px solid var(--line); }
table.res tr.win td { background: color-mix(in srgb, var(--glow) 18%, transparent); font-weight: 700; }
table.res td.tot { font: 900 20px var(--font-display); }
table.res small { display: block; color: var(--muted); font-weight: 400; }
.winner { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--primary); color: var(--primary-ink); font: 800 18px var(--font-display); }

.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; max-width: min(92vw, 520px); padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--panel); font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.3); }

@media (max-width: 980px) {
  .game { grid-template-columns: minmax(0, 1fr); }
  .legend { display: none; }
}
@media (max-width: 560px) {
  .shell { padding-block: 8px 28px; }
  .board { aspect-ratio: 1 / 1; }
  .pstats { gap: 6px; }
  .hand { gap: 4px; }
  .dialog { padding: 16px; border-radius: 14px; }
  .tpick { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="stripe" aria-hidden="true"><i style="background:var(--c-red)"></i><i style="background:var(--c-green)"></i><i style="background:var(--c-purple)"></i><i style="background:var(--c-amber)"></i><i style="background:var(--c-blue)"></i><i style="background:var(--c-brown)"></i></div>
      <h1>Lion City Rails</h1>
    </div>
    <div class="status" id="status"></div>
    <div class="topbtns">
      <button type="button" class="btn small" data-act="rules">Rules</button>
      <button type="button" class="btn small" data-act="sound" id="soundBtn">Sound on</button>
      <button type="button" class="btn small" data-act="menu">Menu</button>
    </div>
  </header>
  <main class="game">
    <section class="boardwrap" aria-label="Game board">
      <div class="board" id="board">
        <svg id="map" role="group" aria-label="Map of Singapore with MRT routes" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="legend" id="legend" aria-hidden="true"></div>
        <div class="zoomctl">
          <button type="button" data-act="zoom-in" aria-label="Zoom in">+</button>
          <button type="button" data-act="zoom-out" aria-label="Zoom out">&minus;</button>
          <button type="button" data-act="zoom-fit" aria-label="Fit whole map" style="font-size:12px">Fit</button>
        </div>
        <div class="maptip" id="maptip" hidden></div>
      </div>
      <div class="sheet" id="sheet" hidden></div>
    </section>
    <aside class="side" id="side" aria-label="Play desk"></aside>
  </main>
</div>
<div id="overlay"></div>
<div class="toast" id="toast" role="status" hidden></div>

  const r = E.ROUTES[ri], s = App.state, o = s ? s.routes[ri] : -1;
  const ci = r.color === 'grey' ? -1 : COLORS.indexOf(r.color);
  tip.textContent = `${E.NODES[r.a].name} to ${E.NODES[r.b].name} · ${r.len} cars · +${E.SCORE[r.len]} · ${ci >= 0 ? LINES[ci].name : 'any colour'}${r.flags === 'F1' ? ' · needs Express' : ''}${o >= 0 ? ' · owned by ' + s.players[o].name : ''}`;
  tip.hidden = false;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  onAct(el.dataset.act, el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (App.overlay === 'rules' || App.overlay === 'results' || (App.overlay === 'menu' && App.state))) { if (App.overlay === 'rules' && !App.state) showMenu(); else closeOverlay(); }
  if (e.key === 'Enter' && e.target && e.target.id === 'jcode') onAct('join', e.target);
});
$('#side').addEventListener('mouseover', e => {
  const t = e.target.closest && e.target.closest('[data-ti]');
  const ti = t && t.dataset.act === 'tix-toggle' ? +t.dataset.ti : null;
  if (ti !== App.hover) { App.hover = ti; if (App.state) { const keep = App.hlTicket; App.hlTicket = ti != null ? ti : keep; } }
});
$('#sheet').addEventListener('mouseover', e => {
  const t = e.target.closest && e.target.closest('[data-ti]');
  const ti = t ? +t.dataset.ti : null;
  if (ti !== App.hover) { App.hover = ti; const prev = App.hlTicket; App.hlTicket = ti; if (prev !== ti) paintMap(); }
});
$('#sheet').addEventListener('mouseleave', () => { if (App.hover != null) { App.hover = null; App.hlTicket = null; paintMap(); } });

/* ---------- boot ---------- */
function boot() {
  $('#legend').innerHTML = COLORS.map((c, i) => `<span style="color:var(--c-${c})"><svg viewBox="-6 -6 12 12"><rect x="-5.5" y="-3.2" width="11" height="6.4" rx="1.6"/></svg><b style="color:var(--ink);font-weight:700">${LINES[i].code}</b></span>`).join('')
    + `<span style="color:var(--ink)"><svg viewBox="-6 -6 12 12">${MV.glyphSVG(8).replace(/^<svg[^>]*>|<\/svg>$/g, '')}</svg><b>Express</b></span>`;
  MV.init({ onRoute, onHover });
  renderTop(); paintMap();
  showMenu();
  if (Net.onLink) Net.onLink(k => toast(k === 'back' ? 'Reconnected to the host.' : k === 'gone' ? 'Could not reconnect. The host may have closed the game.' : k === 'brokerlost' ? 'Lost the connection service. Friends cannot find your game until it is back. Reconnecting…' : k === 'brokerback' ? 'Connection service is back. Friends can join again.' : 'Lost the connection to the host. Reconnecting…'));
  Net.init().then(res => {
    App.net = res; App.netChecked = true;
    if (res && res.ok && !App.nick && res.name) { App.nick = res.name.slice(0, 16); }
    if (App.overlay === 'menu') { readNick(); showMenu(); }
  });
  g.__LCR = { App, E, MV };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(typeof globalThis !== 'undefined' ? globalThis : window);

</script>
</body>
